# Configuration for large file uploads
<IfModule mod_php.c>
    php_value upload_max_filesize 1024M
    php_value post_max_size 1100M
    php_value memory_limit 1200M
    php_value max_execution_time 300
    php_value max_input_time 300
</IfModule>

# For CGI scripts
<IfModule mod_cgi.c>
    # Increase timeouts for large file handling
    TimeOut 1800
</IfModule>
<IfModule mod_cgid.c>
    # Increase timeouts for large file handling
    TimeOut 1800
</IfModule>

# Set maximum request body size to 1GB + some overhead
LimitRequestBody 1100000000