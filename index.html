<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRM Sign Language Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141820;
        font-family: system-ui, -apple-system, sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      button,
      select {
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(24, 30, 42, 0.85);
        color: #f3f6fc;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      button:hover:not(:disabled),
      select:hover {
        background: rgba(45, 58, 82, 0.92);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .timeline-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(24, 30, 42, 0.78);
        color: #cbd5e1;
        font-size: 13px;
        backdrop-filter: blur(8px);
      }
      #timeline-slider {
        width: 220px;
        accent-color: #60a5fa;
        cursor: pointer;
      }
      #status {
        color: #cbd5e1;
        font-size: 13px;
        background: rgba(24, 30, 42, 0.72);
        padding: 8px 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <select id="avatar-select" aria-label="Select VRM Avatar">
        <option value="/Seed-san.vrm">Seed-san (Seed-san.vrm)</option>
        <option value="/eva.vrm">Eva (eva.vrm)</option>
      </select>
      <button id="test-pose-btn" type="button">Test Wave / Pose</button>
      <button id="play-sign-btn" type="button" disabled>Play ስም (Name)</button>
      <label class="timeline-box">
        <input id="timeline-slider" type="range" min="0" max="0" step="1" value="0" disabled />
        <span id="frame-label">0 / 0</span>
      </label>
      <span id="status">Loading avatar...</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
