name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Caching Buildozer's global dir (SDK/NDK) drastically reduces build times.
      # IMPORTANT:
      #   * do NOT cache the project-local .buildozer build tree — a build tree
      #     saved from a failed run poisons later runs (e.g. hostpython3 with a
      #     missing 'math' module, because its should_build() skips rebuilding)
      #   * no restore-keys — restoring older artifacts mixes toolchain versions
      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('buildozer.spec') }}

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf build-essential ccache cmake git libffi-dev \
            libncurses-dev libssl-dev libtinfo6 libtool pkg-config \
            unzip zlib1g-dev zip

      # The pinned python-for-android's libffi recipe runs 'autogen.sh'
      # (autoreconf) and needs the LT_SYS_SYMBOL_USCORE macro. Without
      # 'libltdl-dev' (which puts libtool's m4 on aclocal's search path)
      # autoreconf fails with "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
      - name: Install libltdl-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev

      - name: Install Python Dependencies & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer Cython Kivy

      - name: Build Android Debug APK
        run: |
          # The 'yes |' automatically accepts the Android SDK license prompts
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-Android-Debug-APK
          path: bin/*.apk
          if-no-files-found: error
